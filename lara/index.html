<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lara's Kudo Board</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Light gray background to make colors pop */
        }
        .handwritten {
            font-family: 'Caveat', cursive;
        }
        /* CSS Columns for the Masonry layout */
        #board-container {
            column-count: 1;
            column-gap: 1.5rem;
        }
        @media (min-width: 640px) { #board-container { column-count: 2; } }
        @media (min-width: 1024px) { #board-container { column-count: 3; } }
        @media (min-width: 1280px) { #board-container { column-count: 4; } }
        
        .kudo-card {
            break-inside: avoid; /* Prevents cards from splitting across columns */
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body class="min-h-screen p-6 md:p-12">

    <header class="mb-12 text-center max-w-2xl mx-auto">
        <h1 class="text-6xl font-bold text-gray-900 handwritten mb-3 transform -rotate-2">Lara Michels' DLA Board</h1>
        <p class="text-gray-600 mb-8 text-lg">Celebrating our 2026 Distinguished Librarian Award winner!</p>
        
        <!-- NEW: The Add Kudo Button -->
        <a href="https://forms.gle/2SQMTTJFefduTHSQ7" target="_blank" rel="noopener noreferrer" 
           class="inline-block bg-blue-600 text-white font-bold text-lg py-3 px-8 rounded-full shadow-lg hover:bg-blue-700 hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1">
            ➕ Add a Kudo
        </a>
    </header>

    <div id="loading" class="text-center text-gray-500 font-medium py-10">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-gray-900 mb-3"></div>
        <p>Loading messages...</p>
    </div>

    <div id="error-message" class="hidden max-w-lg mx-auto bg-red-100 border-l-4 border-red-500 text-red-700 p-4 rounded shadow-md mb-8">
        <p class="font-bold">Oops! Could not load the board.</p>
        <p class="text-sm mt-1">Please check the Google Sheet URL and ensure it is published to the web.</p>
    </div>

    <div id="board-container" class="max-w-7xl mx-auto w-full">
        <!-- Cards will be injected here by JavaScript -->
    </div>

    <script>
        // REPLACE THIS WITH LARA'S PUBLISHED GOOGLE SHEET CSV URL
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTvWDk5ppdtirpsfyF8EqONmjBDgv6v7f9v9SThnhjA5L0Im0Ed-4Q9eKsBZjUYDexfWoAQN5TvyQ-F/pub?gid=1861857963&single=true&output=csv";

        // Array of sticky note colors to randomly assign
        const noteColors = [
            'bg-yellow-200', 'bg-pink-200', 'bg-blue-200', 
            'bg-green-200', 'bg-purple-200', 'bg-orange-200'
        ];

        // Safely extract the Google Drive File ID and convert to a thumbnail link
        function getDriveThumbnailUrl(rawUrl) {
            if (!rawUrl || rawUrl.trim() === '') return null;
            
            // Regex to find the ID (looks for id=XYZ or /d/XYZ/)
            const idMatch = rawUrl.match(/(?:id=|\/d\/)([a-zA-Z0-9_-]{25,})/);
            
            if (idMatch && idMatch[1]) {
                const fileId = idMatch[1];
                // Using the thumbnail API bypasses the new Google Drive security blocks
                return `https://drive.google.com/thumbnail?id=${fileId}&sz=w800`;
            }
            return null; // Return null if it's not a recognized Drive link
        }

        // Basic CSV parser that handles commas inside quotes
        function parseCSV(text) {
            const result = [];
            let row = [];
            let inQuotes = false;
            let currentStr = '';

            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    row.push(currentStr.trim());
                    currentStr = '';
                } else if (char === '\n' && !inQuotes) {
                    row.push(currentStr.trim());
                    result.push(row);
                    row = [];
                    currentStr = '';
                } else {
                    currentStr += char;
                }
            }
            if (currentStr) row.push(currentStr.trim());
            if (row.length > 0) result.push(row);
            return result;
        }

        function renderBoard(data) {
            const container = document.getElementById('board-container');
            const loading = document.getElementById('loading');
            
            loading.classList.add('hidden');
            
            // Skip the first row (headers) and loop through the data
            for (let i = 1; i < data.length; i++) {
                const row = data[i];
                
                // Make sure row has data
                if (row.length < 3 || (!row[1] && !row[2])) continue;

                const timestamp = row[0];
                const name = row[1];
                const message = row[2];
                // Looking at Column E (index 4) for the image link
                const rawImageUrl = row[4]; 
                
                const imageUrl = getDriveThumbnailUrl(rawImageUrl);
                const color = noteColors[i % noteColors.length];

                // Build the card HTML
                const card = document.createElement('div');
                card.className = `kudo-card ${color} p-6 rounded-xl shadow-md transform transition-transform hover:-translate-y-1 hover:shadow-lg relative`;
                
                // Add decorative tape at the top
                const tape = document.createElement('div');
                tape.className = 'absolute -top-3 left-1/2 w-16 h-6 bg-white/40 border border-black/5 shadow-sm transform -translate-x-1/2 rotate-1';
                card.appendChild(tape);

                let cardContent = '';

                // Add image if it exists
                if (imageUrl) {
                    cardContent += `
                        <div class="mb-4 rounded-lg overflow-hidden border-2 border-white/50 shadow-sm">
                            <img src="${imageUrl}" alt="Uploaded photo" class="w-full h-auto object-cover max-h-64" loading="lazy" onerror="this.style.display='none'">
                        </div>
                    `;
                }

                // Add message and name
                cardContent += `
                    <p class="text-gray-800 text-lg mb-4 whitespace-pre-wrap">${message}</p>
                    <p class="handwritten text-2xl font-bold text-gray-900 text-right">- ${name}</p>
                `;

                card.innerHTML += cardContent;
                container.appendChild(card);
            }
        }

        async function init() {
            try {
                const response = await fetch(CSV_URL);
                if (!response.ok) throw new Error('Network response was not ok');
                
                const csvText = await response.text();
                const data = parseCSV(csvText);
                renderBoard(data);
                
            } catch (error) {
                console.error('Error loading CSV:', error);
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('error-message').classList.remove('hidden');
            }
        }

        // Start the app
        init();
    </script>
</body>
</html>
