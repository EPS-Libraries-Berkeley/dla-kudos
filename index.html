<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Kudos Boards</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
        }
        .handwritten {
            font-family: 'Caveat', cursive;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 text-gray-800">

    <main class="max-w-lg w-full bg-white/60 backdrop-blur-md rounded-2xl shadow-xl p-8 md:p-10 text-center border border-white">
        
        <div class="mb-10">
            <h1 class="text-4xl font-extrabold tracking-tight text-gray-900 mb-3">2026 Distinguished Librarian Award</h1>
            <p class="text-gray-600 text-lg">Select a board below to share congratulations with our 2026 awardees.</p>
        </div>

        <div class="space-y-5">
            <!-- Link to Jenny's Folder -->
            <a href="./jenny/" class="relative block w-full bg-yellow-200 hover:bg-yellow-300 text-gray-900 font-bold py-5 px-6 rounded-xl shadow-md hover:shadow-lg transition-all duration-300 transform hover:-translate-y-1">
                <span class="handwritten text-3xl">Jenny's DLA Board</span>
                
                <!-- Decorative tape -->
                <div class="absolute top-0 left-1/2 w-16 h-6 bg-white/40 border border-black/5 shadow-sm transform -translate-x-1/2 -translate-y-1/2 -rotate-2"></div>
            </a>

            <!-- Link to the Second Person's Folder -->
            <!-- Update the href attribute to match your second folder's name -->
            <a href="./lara/" class="relative block w-full bg-blue-200 hover:bg-blue-300 text-gray-900 font-bold py-5 px-6 rounded-xl shadow-md hover:shadow-lg transition-all duration-300 transform hover:-translate-y-1">
                <span class="handwritten text-3xl">Lara's DLA Board</span>
                
                <!-- Decorative tape -->
                <div class="absolute top-0 left-1/2 w-16 h-6 bg-white/40 border border-black/5 shadow-sm transform -translate-x-1/2 -translate-y-1/2 rotate-3"></div>
            </a>
        </div>

    </main>

</body>
</html>
